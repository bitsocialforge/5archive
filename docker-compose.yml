# 5archive — closed-source 5chan archiver.
#
# Runs the public `bitsocial-indexer` engine (built straight from GitHub),
# configured to index only 5chan communities and branded as 5archive. Bind to
# localhost; a reverse proxy (Caddy) terminates TLS for 5archive.org and proxies
# the web UI plus /api → the indexer.
services:
  server:
    build:
      context: https://github.com/bitsocialnet/bitsocial-indexer.git#main:server
    environment:
      SITE_NAME: 5archive
      SITE_URL: ${SITE_URL:-https://5archive.org}
      # The 5chan bitsocial-cli daemon (PKC RPC). Secret — set in .env, never commit.
      PKC_RPC_URL: ${PKC_RPC_URL}
      # Index only the 5chan board directories (generated by scripts/build-communities.mjs).
      COMMUNITIES_SOURCE: /config/communities.json
      DB_PATH: /data/5archive.db
      CRAWL_INTERVAL_MS: ${CRAWL_INTERVAL_MS:-300000}
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-20}
    volumes:
      - ./config:/config:ro
      - data:/data
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  webui:
    build:
      context: https://github.com/bitsocialnet/bitsocial-indexer.git#main:webui
    environment:
      INDEXER_API: http://server:4000
      SITE_NAME: 5archive
      SITE_BADGE: ""   # just "5archive", no badge
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [server]
    restart: unless-stopped

volumes:
  data:
